services:
  - type: web
    name: n8n-selfhosted
    env: node
    buildCommand: |
      corepack enable
      yarn install
      yarn build
    startCommand: yarn start
    envVars:
      - key: N8N_PORT
        value: 3000
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: "admin"
      - key: N8N_BASIC_AUTH_PASSWORD
        value: "mood1234"