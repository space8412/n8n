services:
  - type: web
    name: n8n-selfhosted
    env: node
    buildCommand: |
      npm install -g corepack
      corepack enable
      corepack prepare yarn@3.6.1 --activate
      yarn --version
      yarn install
      yarn build
    startCommand: corepack yarn start
    envVars:
      - key: WEBHOOK_TUNNEL_URL
        value: https://n8n-selfhosted-h1pq.onrender.com
      - key: GENERIC_TIMEZONE
        value: Asia/Seoul
